[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyppetdb"
version = "0.0.1"
requires-python = ">=3.12"
authors = [
  {name = "Stephan.Schultchen", email = "stephan.schultchen@gmail.com"},
]
description = "PyppedDB is a Python replacment for PuppetDB"
license = {file = "LICENSE.txt"}
keywords = []
classifiers = [
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "License :: OSI Approved :: Apache Software License"
]
dependencies = [
  "argon2-cffi>=25.1",
  "authlib>=1.7",
  "bonsai>=1.5",
  "cachetools>=7.1",
  "cryptography>=49",
  "fastapi>=0.136",
  "httptools>=0.7",
  "httpx>=0.28",
  "itsdangerous>=2.2",
  "motor>=3.7",
  "orjson>=3.12",
  "pyahocorasick>=2.3",
  "pydantic[email]>=2.13",
  "pydantic-settings>=2.14",
  "pyhiera>=0.0.1",
  "pymongo>=4.17",
  "pyyaml>=6.0",
  "starlette>=1.3",
  "structlog>=25.5",
  "typing-extensions>=4.15",
  "uvicorn>=0.46",
  "uvloop>=0.22",
  "websockets>=16",
]

[project.scripts]
pyppetdb = "pyppetdb:main.main"

[project.urls]
Repository = "https://github.com/schlitzered/pyppetdb"
Issues = "https://github.com/schlitzered/pyppetdb/issues"

[dependency-groups]
dev = [
  "flake8>=7.1",
  "flake8-pyproject>=1.2",
  "watchfiles>=1.1",
]
docs = [
  "mkdocs-material>=9.6",
]

[tool.hatch.build.targets.wheel]
packages = ["pyppetdb"]

[tool.flake8]
ignore = "E501,W503"
