name: Linting
permissions:
  contents: read

on:
  pull_request:

jobs:
  flake8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --only-group dev --no-install-project
      - name: Run flake8
        run: uv run --no-sync flake8 pyppetdb
